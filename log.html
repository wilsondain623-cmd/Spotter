<title>Log a workout — Dwil Fitness</title>

<style>
:root{--obsidian:#0A0E18;--panel:#111726;--panel2:#161e30;--line:#232c42;--steel:#4D7DB4;--ice:#A8C4E0;--text:#F4F4F5;--muted:#CFD3DC;--dim:#8b93a5;--ok:#5fb48a;--hot:#c95f5f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--obsidian);color:var(--text);font-family:Manrope,Poppins,system-ui,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top,0) 16px 40px}
#app{max-width:520px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:20px 2px 8px}
header .word{font-family:Poppins,sans-serif;font-size:18px}
header .word b{font-weight:700}header .word span{font-weight:500;color:var(--ice)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
h1{font-size:18px;margin-bottom:4px}
.sub{color:var(--dim);font-size:13px;line-height:1.5}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
textarea,input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:11px;color:var(--text);font-family:inherit;font-size:15px;padding:11px 12px;outline:none}
textarea{min-height:120px;resize:vertical;line-height:1.5}
textarea:focus,input:focus{border-color:var(--steel)}
button{font-family:inherit;font-size:15px;font-weight:700;border:none;border-radius:12px;cursor:pointer;width:100%;padding:13px}
.btn{background:var(--steel);color:#fff}
.btn:disabled{opacity:.5}
.prev{margin-top:12px}
.pex{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-bottom:6px;font-size:13px}
.pex .n{font-weight:700}.pex .m{color:var(--dim);font-size:12px}
.pex.unk{border-color:#5a4a2e}.pex.unk .n{color:#e0c48a}
.done{text-align:center;padding:30px 10px}
.done .big{font-size:40px}
.muted{color:var(--dim);font-size:12px;line-height:1.5}
.crescent{width:26px;height:26px}
</style>

   Spotter Engine v2 — Dwil Fitness
   Fatigue model, exercise library, and session text parser.
   v2: per-set (pyramid) parsing via setDetail

const MUSCLES = [
  "quads","hamstrings","glutes","calves","chest","lats","mid-back","low-back",
  "rear-delts","side-delts","front-delts","biceps","triceps","forearms-grip",

];

/* Intensity multipliers (spec) */
const INTENSITY = { warmup: 0.3, moderate: 1.0, heavy: 1.5, max: 2.0 };

const INTENSITY_WORDS = [
  { rx: /\b(warm[\s-]?up|very light|easy|light)\b/i, key: "warmup" },
  { rx: /\b(max(ed)?( out)?|amrap|true failure|to failure|failure)\b/i, key: "max" },
  { rx: /\b(heavy|grindy|grinder|tough|hard|rpe\s?8|rpe\s?9|rpe\s?10)\b/i, key: "heavy" },
  { rx: /\b(moderate|working sets?)\b/i, key: "moderate" },
];

/* Base fatigue per primary muscle per set (moderate). Secondary = 50%. */

const SECONDARY_FACTOR = 0.3;
/* eccentric-emphasis: biggest DOMS/damage driver. "tempo" only counts for lifting
   segments (a "tempo run" is a pace, not a negative). */
function eccOf(seg, isCardio){
  if (/\b(eccentric(s)?|negatives?|slow\s+lowers?|downhill)\b/i.test(seg)) return true;
  if (!isCardio && /\btempo\b/i.test(seg)) return true;
  return false;
}

/* ---------------- Core math ---------------- */

function setLoadSum(nSets) {
  let sum = 0;
  for (let i = 1; i <= nSets; i++) sum += i <= 3 ? 1.0 : i <= 5 ? 0.8 : 0.6;
  return sum;
}

function daysBetween(fromISO, toISO) {
  const ms = new Date(toISO + "T00:00:00") - new Date(fromISO + "T00:00:00");
  return Math.max(0, Math.round(ms / 86400000));
}

function decaySnapshot(snapshot, days) {
  const out = {};
  for (const m of MUSCLES) out[m] = Math.max(0, (snapshot[m] || 0) * Math.pow(DECAY_BY_MUSCLE[m] || DECAY_RATE, days));
  return out;
}

/* readiness-coupled decay: factor<1 (poor recovery) slows clearance, >1 speeds it */
function decaySnapshotAdj(snapshot, days, factor=1) {
  const out = {};
  for (const m of MUSCLES) out[m] = Math.max(0, (snapshot[m] || 0) * Math.pow(DECAY_BY_MUSCLE[m] || DECAY_RATE, days * factor));
  return out;
}

/* exercises: [{name, sets, intensity, primary, secondary}] */
function repFactor(reps) {
  const nums = String(reps ?? "").match(/\d+/g);
  if (!nums || !nums.length) return 1.0;
  const avg = nums.reduce((a,b)=>a + +b, 0) / nums.length;
  return Math.min(1.5, Math.max(0.7, Math.sqrt(avg / 8)));
}

function sessionFatigue(exercises) {
  const add = {};
  for (const m of MUSCLES) add[m] = 0;
  for (const ex of exercises) {
    let load;
    if (ex.setDetail && ex.setDetail.length) {
      load = 0;
      ex.setDetail.forEach((sd, i) => {
        const setF = i < 3 ? 1.0 : i < 5 ? 0.8 : 0.6;
        const im = INTENSITY[sd.intensity ?? ex.intensity] ?? 1.0;
        load += setF * im * repFactor(sd.reps);
      });
    } else {
      load = (INTENSITY[ex.intensity] ?? 1.0) * setLoadSum(ex.sets || 3) * repFactor(ex.reps);
    }
    const exF = ex.ecc ? 1.25 : ex.hold ? 0.85 : 1; /* eccentric damage up, isometric damage down */
    for (const m of ex.primary || []) add[m] += BASE_PRIMARY * load * exF;
    for (const m of ex.secondary || []) add[m] += BASE_PRIMARY * SECONDARY_FACTOR * load * exF;
  }
  return add;
}

/* Full update: decay old snapshot to session date, add session fatigue with DOMS bump, cap. */
function applySession(snapshot, lastUpdated, sessionDate, exercises, tolF = 1) {
  const days = daysBetween(lastUpdated, sessionDate);
  const decayed = decaySnapshot(snapshot, days);
  const add = sessionFatigue(exercises);
  const tf = typeof tolF === "function" ? tolF : () => tolF;
  const out = {};
  for (const m of MUSCLES) out[m] = Math.min(CAP, decayed[m] + add[m] * DOMS_BUMP * tf(m));
  return out;
}

function round1(x) { return Math.round(x * 10) / 10; }

/* ---- Systemic (whole-body) load: recovers ~2x faster than muscle fatigue ---- */
const SYS_BASE = 0.18, SYS_DECAY = 0.62;
function sessionSys(exercises){
  let t = 0;
  for (const ex of exercises) {
    if (ex.setDetail && ex.setDetail.length) {
      let s = 0;
      ex.setDetail.forEach((sd, i) => {
        const setF = i < 3 ? 1.0 : i < 5 ? 0.8 : 0.6;
        s += setF * (INTENSITY[sd.intensity ?? ex.intensity] ?? 1);
      });
      t += SYS_BASE * s * (ex.sys || 1);
    } else {
      t += SYS_BASE * (INTENSITY[ex.intensity] ?? 1) * setLoadSum(ex.sets || 3) * (ex.sys || 1);
    }
  }
  return t;
}
function applySys(v, lastUpdated, date, exercises, tolF = 1){
  if (typeof tolF === "function") tolF = tolF(null);
  const days = daysBetween(lastUpdated, date);
  return Math.min(CAP, v * Math.pow(SYS_DECAY, days) + sessionSys(exercises) * tolF);
}
function decaySys(v, days){ return Math.max(0, v * Math.pow(SYS_DECAY, days)); }

/* ---------------- Parser ---------------- */

function normalize(s) {
  return s.toLowerCase().replace(/[^a-z0-9\s-]/g, " ").replace(/\s+/g, " ").trim();
}

function matchExercise(text, customLib) {
  const t = " " + normalize(text) + " ";
  const tSing = " " + normalize(text).replace(/(\w+)s\b/g, "$1") + " ";
  let best = null, bestLen = 0;
  const libs = customLib ? EXERCISE_LIBRARY.concat(customLib) : EXERCISE_LIBRARY;
  for (const ex of libs) {
    for (const a of ex.aliases) {
      const aa = " " + a + " ";
      const aSing = " " + a.replace(/(\w+)s\b/g, "$1") + " ";
      if ((t.includes(aa) || tSing.includes(aSing) || tSing.includes(aa) || t.includes(aSing)) && a.length > bestLen) {
        best = ex; bestLen = a.length;
      }
    }
  }
  return best;
}

function detectIntensity(text) {
  for (const w of INTENSITY_WORDS) if (w.rx.test(text)) return w.key;
  return "moderate";
}

/* Plain sets×reps: 4x8, 4×8-12, 3 sets of 10, 3x45s, 4 sets.
   First number < 20 (a plausible set count). */
function parseSetsReps(seg) {
  let m;
  if ((m = seg.match(/\b(\d{1,2})\s*(?:[x×]|by)\s*(\d+)(?:\s*[-–]\s*(\d+))?\s*(s|sec|seconds)?\b/i)) && +m[1] < 20) {
    return { sets: +m[1], reps: m[4] ? m[2] + "s" : (m[3] ? `${m[2]}-${m[3]}` : m[2]) };
  }
  if ((m = seg.match(/(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hours?)\b/i))) {
    const mins = Math.round(+m[1] * 60);
    return { sets: Math.max(1, Math.min(6, Math.round(mins / 10))), reps: `${mins}min`, dur: mins };
  }
  if (/\ban?\s+hour\b/i.test(seg)) {
    return { sets: 6, reps: "60min", dur: 60 };
  }
  if (/\bhalf\s+(?:an\s+)?hour\b/i.test(seg)) {
    return { sets: 3, reps: "30min", dur: 30 };
  }
  if ((m = seg.match(/(\d+(?:\.\d+)?)\s*(?:min|mins|minutes)\b/i))) {
    const mins = +m[1];
    return { sets: Math.max(1, Math.min(6, Math.round(mins / 10))), reps: `${mins}min`, dur: mins };
  }
  if ((m = seg.match(/(\d+(?:\.\d+)?)\s*(?:miles?|mi)\b/i))) {
    const mins = +m[1] * 9;
    return { sets: Math.max(1, Math.min(6, Math.round(mins / 10))), reps: `${m[1]}mi`, dist: `${m[1]}mi` };
  }
  if ((m = seg.match(/(\d+(?:\.\d+)?)\s*(?:km|kilometers?)\b/i))) {
    const mins = +m[1] * 5.6;
    return { sets: Math.max(1, Math.min(6, Math.round(mins / 10))), reps: `${m[1]}km`, dist: `${m[1]}km` };
  }
  if ((m = seg.match(/(\d+)\s*sets?\s*(?:of\s*(\d+)(?:\s*[-–]\s*(\d+))?)?/i))) {
    let reps = m[3] ? `${m[2]}-${m[3]}` : (m[2] || "");
    if (!reps) { const rm = seg.match(/\b(\d{1,2})\s*reps?\b/i); if (rm) reps = rm[1]; }
    return { sets: +m[1], reps };
  }
  return null;
}

/* Per-set (pyramid) tokens: weight×reps like "135x10" (first number >= 20),
   or reps@weight like "10@135". Returns [{weight, reps}] in order found. */
function parseSetTokens(seg) {
  const found = [];
  const rx = /(\d+(?:\.\d+)?)\s*(?:[x×]|by|for)\s*(\d+)\b/gi;
  let m;
  while ((m = rx.exec(seg))) {
    const a = +m[1], b = +m[2];
    if (a >= 20) found.push({ weight: a, reps: String(b), idx: m.index, end: m.index + m[0].length });
  }
  const rx2 = /\b(\d{1,2})\s*@\s*(\d+(?:\.\d+)?)/g;
  while ((m = rx2.exec(seg))) {
    const r = +m[1], w = +m[2];
    if (w >= 20) found.push({ weight: w, reps: String(r), idx: m.index, end: m.index + m[0].length });
  }
  found.sort((a, b) => a.idx - b.idx);
  /* per-set intensity: an intensity word between this set token and the next belongs to this set */
  return found.map((t, i) => {
    const tail = seg.slice(t.end, i + 1 < found.length ? found[i + 1].idx : seg.length);
    let int_ = null;
    for (const w of INTENSITY_WORDS) if (w.rx.test(tail)) { int_ = w.key; break; }
    return int_ ? { weight: t.weight, reps: t.reps, intensity: int_ } : { weight: t.weight, reps: t.reps };
  });
}

function parseWeight(seg) {
  let m;
  if ((m = seg.match(/(?:at|@)\s*(\d+(?:\.\d+)?)\s*(?:lbs?|pounds?)?\b/i))) return +m[1];
  if ((m = seg.match(/(\d+(?:\.\d+)?)\s*(?:lbs?|pounds?)\b/i))) return +m[1];
  return null;
}

function maxWeight(setDetail) {
  const ws = setDetail.map(s => s.weight).filter(w => w != null);
  return ws.length ? Math.max(...ws) : null;
}

/* Split free text into segments and parse each.
   A segment with only weight×reps tokens continues the previous exercise
   (pyramid style: "bench 135x10, 155x8, 185x6").
   Returns { parsed: [...], unmatched: [...] } */
function parseSession(text, customLib) {
  const segments = text
    .split(/\n|,|;|•|(?:\s+then\s+)|(?:finished with)|(?:started with)/i)
    .map(s => s && s.trim()).filter(s => s && s.length > 1);
  const parsed = [], unmatched = [];
  let last = null; /* most recent item (parsed or unmatched) for pyramid continuation */
  const sideOf = s => /\b(left|l)\b/i.test(s) ? "L" : /\b(right|r)\b/i.test(s) ? "R" : null;
  const timeList = s => [...s.matchAll(/(\d+(?:\.\d+)?)\s*(s|sec|secs|seconds|min|mins|minutes)\b/gi)]
    .map(m => ({ n: +m[1], sec: /^s/i.test(m[2]) && !/^min/i.test(m[2]) }));
  const boutify = (item, list) => { /* interval cardio: several timed bouts in one exercise */
    const mins = list.map(t => t.sec ? t.n / 60 : t.n);
    item.bouts = mins.map(m => Math.round(m * 10) / 10);
    item.dur = Math.round(mins.reduce((a, b) => a + b, 0) * 10) / 10;
    item.sets = Math.max(1, Math.min(6, Math.round(item.dur / 10)));
    item.reps = item.bouts.join("+") + "min";
  };
  const holdify = (item, list) => { /* varying holds: per-set times via setDetail */
    item.setDetail = list.map(t => ({ reps: t.sec ? `${t.n}s` : `${t.n}min`, weight: null }));
    item.sets = list.length;
    item.reps = item.setDetail.map(x => x.reps).join("/");
    item.weight = null;
  };
  const appendTokens = (item, tokens) => {
    if (!item.setDetail) {
      item.setDetail = [];
      const n = item.assumedSets ? 0 : (item.sets || 0);
      for (let i = 0; i < n; i++) item.setDetail.push({ reps: item.reps || "", weight: item.weight ?? null });
      delete item.assumedSets;
    }
    item.setDetail.push(...tokens);
    item.sets = item.setDetail.length;
    item.reps = item.setDetail.map(t => t.reps).join("/");
    item.weight = maxWeight(item.setDetail);
  };
  for (const seg of segments) {
    const tokens = parseSetTokens(seg);
    const sr = parseSetsReps(seg);
    const ex = matchExercise(seg, customLib);
    if (ex) {
      const base = { name: ex.name, primary: ex.p, secondary: ex.s, intensity: detectIntensity(seg), raw: seg };
      if (/\b(bw|body\s?weight|bodyweight)\b/i.test(seg)) base.bw = true;
      if (ex.hold) base.hold = true;
      if (ex.ecc || eccOf(seg, !!(sr && (sr.dur || sr.dist)))) base.ecc = true;
      if (/\bband(s|ed)?\b/i.test(seg) || /band/i.test(ex.name)){
        const cm = seg.match(/\b(red|blue|green|black|purple|orange|yellow|gr[ae]y|white|pink|teal|tan|gold|silver)\b/i);
        base.band = cm ? cm[1].toLowerCase() : "band";
      }
      const sd_ = sideOf(seg);
      if (sd_){ base.side = sd_; base.name = ex.name + " (" + sd_ + ")"; }
      let item;
      const tl = timeList(seg);
      if (tokens.length) {
        item = { ...base, setDetail: tokens, sets: tokens.length,
          reps: tokens.map(t => t.reps).join("/"), weight: maxWeight(tokens) };
      } else if (base.hold && tl.length && (!sr || tl.length > 1)) {
        item = { ...base };
        holdify(item, tl);
      } else if (sr) {
        item = { ...base, sets: sr.sets, reps: sr.reps, weight: parseWeight(seg),
          ...(sr.dur ? { dur: sr.dur } : {}), ...(sr.dist ? { dist: sr.dist } : {}) };
        if (item.dur && tl.length > 1) boutify(item, tl); /* interval cardio in one breath */
      } else {
        item = { ...base, sets: 3, reps: "", weight: parseWeight(seg), assumedSets: true };
      }
      parsed.push(item); last = item;
    } else if (last && (last.hold || last.dur) && /^\s*(?:and\s+)?\d+(?:\.\d+)?\s*(s|sec|secs|seconds|min|mins|minutes)\s*$/i.test(seg)) {
      const t = timeList(seg)[0];
      if (last.hold) {
        if (!last.setDetail) last.setDetail = (last.sets && last.reps) ? Array.from({length:last.sets}, () => ({ reps: last.reps, weight: null })) : [];
        last.setDetail.push({ reps: t.sec ? `${t.n}s` : `${t.n}min`, weight: null });
        last.sets = last.setDetail.length;
        last.reps = last.setDetail.map(x => x.reps).join("/");
      } else {
        const list = (last.bouts || [last.dur]).map(m => ({ n: m, sec: false }));
        list.push(t);
        boutify(last, list);
      }
    } else if (tokens.length && !sr && last) {
      const segSide = sideOf(seg);
      if (segSide && last.side && segSide !== last.side) {
        /* "single leg rdl left 95x8, right 45x10" — same lift, other side, own numbers */
        const baseName = last.name.replace(/ \((L|R)\)$/, "");
        const item = { name: baseName + " (" + segSide + ")", primary: last.primary, secondary: last.secondary,
          side: segSide, intensity: detectIntensity(seg) === "moderate" ? last.intensity : detectIntensity(seg),
          raw: seg, setDetail: tokens, sets: tokens.length,
          reps: tokens.map(t => t.reps).join("/"), weight: maxWeight(tokens),
          ...(last.bw ? { bw: true } : {}), ...(last.unmatched ? { unmatched: true } : {}) };
        (last.unmatched ? unmatched : parsed).push(item); last = item;
      } else {
        /* bare weight×reps segment: continuation of previous exercise (pyramid sets) */
        appendTokens(last, tokens);
      }
    } else if (sr || tokens.length || (/\b(iso(metric)?|hold)\b/i.test(seg) && timeList(seg).length)) {
      const item = { raw: seg, sets: sr ? sr.sets : tokens.length, reps: sr ? sr.reps : tokens.map(t=>t.reps).join("/"),
        weight: tokens.length ? maxWeight(tokens) : parseWeight(seg),
        setDetail: tokens.length ? tokens : undefined, intensity: detectIntensity(seg) };
      if (/\b(bw|body\s?weight|bodyweight)\b/i.test(seg)) item.bw = true;
      if (eccOf(seg, false)) item.ecc = true;
      if (/\b(iso(metric)?|hold)\b/i.test(seg)){
        item.hold = true;
        const tl2 = timeList(seg);
        if (tl2.length && !tokens.length) holdify(item, tl2);
      }
      if (/\bband(s|ed)?\b/i.test(seg)){
        const cm = seg.match(/\b(red|blue|green|black|purple|orange|yellow|gr[ae]y|white|pink|teal|tan|gold|silver)\b/i);
        item.band = cm ? cm[1].toLowerCase() : "band";
        item.weight = null;
      }
      unmatched.push(item); last = item;
    }
    /* else: filler text, skip */
  }
  return { parsed, unmatched };
}

/* ---------------- Brief ---------------- */

const BIG_GROUPS = ["quads","hamstrings","glutes","chest","lats","mid-back"];

function brief(snapshot, lastUpdated, todayISO, recFactor=1) {
  const days = daysBetween(lastUpdated, todayISO);
  const cur = decaySnapshotAdj(snapshot, days, recFactor);
  const recovering = MUSCLES.filter(m => cur[m] > 4.0).sort((a, b) => cur[b] - cur[a]);
  const fresh = MUSCLES.filter(m => cur[m] < 1.5);
  const readyBig = BIG_GROUPS.filter(m => cur[m] < 4.0).sort((a, b) => cur[a] - cur[b]);
  let suggestion;
  if (recovering.length === 0 && readyBig.length === BIG_GROUPS.length) {
    suggestion = "Everything is recovered — any focus works. Good day for the heaviest priority lift.";
  } else if (readyBig.length > 0) {
    suggestion = "Ready to load: " + readyBig.join(", ") + ". Steer volume there; go easy on " + (recovering.slice(0, 3).join(", ") || "nothing — all clear") + ".";
  } else {
    suggestion = "Every big group still carries fatigue — favor technique, core, or lighter accessory work today.";
  }
  return { current: cur, daysSince: days, recovering, fresh, ready: readyBig, suggestion };
}

/* ---- Recovery entry parser: "recovery 45 hrv 42 rhr 58 slept 6.5 steps 9k feel 3" ---- */
function parseRecovery(text){
  const t = " " + text.toLowerCase().replace(/[,;]/g," ") + " ";
  const num = rx => { const m = t.match(rx); return m ? parseFloat(m[1]) : null; };
  const k = rx => { const m = t.match(rx); if(!m) return null; let v = parseFloat(m[1]); if (/k/i.test(m[2]||"")) v*=1000; return Math.round(v); };
  const out = {};
  let v;
  if ((v = num(/\b(?:whoop|recovery|recov|readiness|body\s*battery|oura|garmin|fitbit|energy(?:\s*score)?)\s*(?:score\s*)?(\d{1,3})\s*%?/)) != null) out.whoop = Math.min(100, v);
  if ((v = num(/\bsleep\s*score\s*(\d{1,3})/)) != null) out.sleepQ = Math.max(1, Math.min(5, Math.round(v/20)));
  if ((v = num(/\bhrv\s*(\d{1,3})/)) != null) out.hrv = v;
  if ((v = num(/\b(?:rhr|resting(?:\s*(?:hr|heart\s*rate))?)\s*(\d{2,3})/)) != null) out.rhr = v;
  if ((v = num(/\b(?:slept|sleep(?:\s*(?:for|time|duration))?)\s*(\d{1,2}(?:\.\d)?)\s*(?:h|hr|hrs|hours)?/)) != null) out.sleepH = v;
  if ((v = num(/\b(?:sleep\s*quality|quality)\s*(\d)/)) != null) out.sleepQ = v;
  const sm = t.match(/\b(?:steps?)\s*(\d{1,3}(?:[.,]?\d{3})*|\d+(?:\.\d+)?)\s*(k)?/) || t.match(/\b(\d{1,2}(?:\.\d+)?)\s*(k)\s*steps?/);
  if (sm){ let s = parseFloat(String(sm[1]).replace(/,/g,"")); if (/k/i.test(sm[2]||"")) s*=1000; out.steps = Math.round(s); }
  if ((v = num(/\b(?:feel(?:ing)?|mood)\s*(\d)\b/)) != null) out.feel = Math.min(5, v);
  return out;
}

const Engine = {
  MUSCLES, INTENSITY, EXERCISE_LIBRARY, BASE_PRIMARY, SECONDARY_FACTOR, DECAY_RATE, DOMS_BUMP, CAP,
  setLoadSum, daysBetween, decaySnapshot, sessionFatigue, applySession, round1, DECAY_BY_MUSCLE, repFactor, eccOf,
  decaySnapshotAdj, parseRecovery,
  SYS_BASE, SYS_DECAY, sessionSys, applySys, decaySys,
  normalize, matchExercise, detectIntensity, parseSetsReps, parseSetTokens, parseWeight, maxWeight,
  parseSession, brief, BIG_GROUPS,
};

if (typeof module !== "undefined") module.exports = Engine;
if (typeof window !== "undefined") window.Engine = Engine;

      if (x.band) continue;
      let v = null, unit = "";
      if (x.hold){ v = x.setDetail && x.setDetail.length ? Math.max(...x.setDetail.map(sd=>holdS(sd.reps)),0) : (x.dur ? Math.round(x.dur*60) : holdS(x.reps)); unit = "s"; }
      else if (x.dur){ v = x.dur; unit = " min"; }
      else if (x.dist){ v = parseFloat(x.dist)||null; unit = String(x.dist).toLowerCase().includes("mi") ? " mi" : " km"; }
      else if (x.bw){ v = x.setDetail && x.setDetail.length ? Math.max(...x.setDetail.map(sd=>repN(sd.reps)),0) : repN(x.reps); unit = " reps"; }
      else if (x.setDetail && x.setDetail.length){ let best=0; for (const sd of x.setDetail){ if (sd.weight!=null) best=Math.max(best, e1rm(sd.weight, repN(sd.reps))); } if (best) { v=best; unit=" e1RM"; } }
      else if (x.weight != null){ v = e1rm(x.weight, repN(x.reps)); unit = " e1RM"; }
      if (v){ (map[x.name] = map[x.name] || { unit, pts: [] }).pts.push({ d: s.date, v }); }
    }
  }
  return map;
}
function miniChart(name, ser){
  const pts = ser.pts.slice(-12);
  if (pts.length < 2) return "";
  const W = 300, H = 84, L = 8, R = 8, T = 16, B = 16;
  let lo = Math.min(...pts.map(p=>p.v)), hi = Math.max(...pts.map(p=>p.v));
  if (hi === lo){ hi += 1; lo = Math.max(0, lo - 1); }
  const X = i => L + (W-L-R) * i / (pts.length - 1);
  const Y = v => T + (H-T-B) * (1 - (v - lo) / (hi - lo));
  const path = pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  const first = pts[0], last = pts[pts.length-1];
  const delta = Math.round((last.v - first.v) * 10) / 10;
  return `<div style="background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px">
    <div style="display:flex;justify-content:space-between;font-size:12px"><b>${esc(name)}</b>
      <span style="color:${delta>=0?"var(--ok)":"var(--hot)"}">${delta>=0?"+":""}${delta}${esc(ser.unit)}</span></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">
      <path d="${path}" fill="none" stroke="#4D7DB4" stroke-width="2"/>
      <circle cx="${X(pts.length-1)}" cy="${Y(last.v)}" r="3.5" fill="#A8C4E0"/>
      <text x="${L}" y="${H-3}" fill="#8b93a5" font-size="10">${fmtD(first.d)} · ${first.v}${esc(ser.unit)}</text>
      <text x="${W-R}" y="12" fill="#CFD3DC" font-size="11" font-weight="700" text-anchor="end">${last.v}${esc(ser.unit)} · ${fmtD(last.d)}</text>
    </svg></div>`;
}
function painSpark(cis){
  const pts = cis.slice(-10).map(x=>x.pain);
  if (pts.length < 2) return "";
  return `<svg viewBox="0 0 110 24" style="width:110px;height:24px">${pts.map((p,j)=>{
    const x = 5 + 100*j/(pts.length-1), y = 21 - 17*p/10;
    return (j?`<line x1="${5+100*(j-1)/(pts.length-1)}" y1="${21-17*pts[j-1]/10}" x2="${x}" y2="${y}" stroke="#ba68c8" stroke-width="1.5"/>`:"") + `<circle cx="${x}" cy="${y}" r="1.8" fill="#e3c8ec"/>`;
  }).join("")}</svg>`;
}
function progressView(){
  if (meErr) return `<div class="card"><h1>Progress unavailable</h1><div class="sub">${esc(meErr)}</div></div>`;
  if (!me) return `<div class="card"><div class="sub">Loading your progress…</div></div>`;
  const now = Date.now();
  const last30 = me.sessions.filter(s => (now - new Date(s.date+"T00:00:00")) / 86400000 <= 30);
  const lastS = me.sessions[0];
  const series = seriesOf(me.sessions);
  const names = Object.keys(series).sort((a,b)=>{
    const pa = series[a].pts, pb = series[b].pts;
    return pb[pb.length-1].d.localeCompare(pa[pa.length-1].d);
  }).slice(0, 6);
  const packUsed = me.pay && me.pay.type === "pack" ? null : null;
  const prs = [...me.prs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0, 10);
  const recov = (me.recovery||[]).filter(r=>r.whoop!=null).slice(-14);
  return `
  <div class="card"><h1>Your last 30 days</h1>
    <div class="sub" style="margin-top:6px"><b style="color:var(--ice)">${last30.length}</b> sessions logged${lastS?` · last: ${esc(lastS.title)} on ${fmtD(lastS.date)}`:""}${me.pay&&me.pay.type==="pack"?` · training pack with your coach`:""}</div>
  </div>
  ${names.length?`<div class="card"><h1>Lift progress</h1><div class="sub" style="margin-bottom:10px">Your strongest set each session — direction matters more than any single day.</div>${names.map(n=>miniChart(n, series[n])).join("")}</div>`:""}
  ${prs.length?`<div class="card"><h1>Personal records</h1>${prs.map(p=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)"><span>${esc(p.exercise)}</span><b style="color:var(--ice)">${p.bw?`${p.reps} reps`:p.hold?`${p.secs}s hold`:`${p.weight} lbs`}</b></div>`).join("")}</div>`:""}
  ${(me.injuries||[]).length?`<div class="card"><h1>Recovery tracking</h1>${me.injuries.map(i=>{
    const ci = i.checkIns[i.checkIns.length-1];
    return `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:13px"><b>${esc(i.label)}</b>${ci?`<span style="color:var(--dim)"> · pain ${ci.pain}/10 latest</span>`:""}</div>${painSpark(i.checkIns)}</div>
    <div style="font-size:11px;color:var(--dim);margin-top:2px">Managed together with your coach — keep the check-ins coming, they steer your programming.</div></div>`;
  }).join("")}</div>`:""}
  ${recov.length>2?`<div class="card"><h1>Recovery scores</h1><div class="sub">Last ${recov.length} entries from your tracker.</div>
    <svg viewBox="0 0 300 70" style="width:100%;display:block;margin-top:6px">${recov.map((r,j)=>{
      const x = 10 + 280*j/(recov.length-1), y = 62 - 50*r.whoop/100;
      return (j?`<line x1="${10+280*(j-1)/(recov.length-1)}" y1="${62-50*recov[j-1].whoop/100}" x2="${x}" y2="${y}" stroke="#4D7DB4" stroke-width="1.5"/>`:"") + `<circle cx="${x}" cy="${y}" r="2" fill="#A8C4E0"/>`;
    }).join("")}</svg></div>`:""}
  <div class="muted" style="text-align:center;margin-top:4px">Your data is stored securely for coaching purposes only and never shared.<br>Ask ${"Dain"} anytime to see, correct, or delete it.</div>`;
}

function render(){
  if (submitted){
    app.innerHTML = `<header>${crescent}<div class="word"><b>Dwil</b> <span>Fitness</span></div></header>
      <div class="card done"><div class="big">✓</div><h1 style="margin-top:8px">Workout sent</h1>
      <div class="sub" style="margin-top:6px">Thanks${client?", "+esc(client):""} — your coach will review it and it'll factor into your training.</div>
      <button class="btn" style="margin-top:18px" onclick="submitted=false;render()">Log another</button></div>`;
    return;
  }
  if (!client || !worker){
    app.innerHTML = `<div class="card"><h1>Link not set up</h1><div class="sub">Ask your coach for your personal workout-log link.</div></div>`;
    return;
  }
  const t = (app.querySelector("#t")||{}).value || "";
  const tabs = `<div style="display:flex;gap:8px;margin-bottom:12px">
    <button style="flex:1;padding:10px;border-radius:11px;font-size:14px;${tab==="log"?"background:var(--steel);color:#fff":"background:var(--panel);color:var(--muted);border:1px solid var(--line)"}" id="tabLog">Log</button>
    <button style="flex:1;padding:10px;border-radius:11px;font-size:14px;${tab==="progress"?"background:var(--steel);color:#fff":"background:var(--panel);color:var(--muted);border:1px solid var(--line)"}" id="tabProg">My progress</button></div>`;
  if (tab === "progress"){
    app.innerHTML = `<header>${crescent}<div class="word"><b>Dwil</b> <span>Fitness</span></div></header>${tabs}${progressView()}`;
    app.querySelector("#tabLog").addEventListener("click", ()=>{ tab="log"; render(); });
    app.querySelector("#tabProg").addEventListener("click", ()=>{ tab="progress"; render(); });
    return;
  }
  app.innerHTML = `<header>${crescent}<div class="word"><b>Dwil</b> <span>Fitness</span></div></header>${tabs}
    <div class="card"><h1>Log a solo workout</h1>
      <div class="sub">${esc(client)} — type what you did in plain English. Sets, reps, weight, and how hard it felt all help.</div>
      <label>Your workout</label>
      <textarea id="t" placeholder="e.g. bench press 4x8 at 185 heavy, incline db press 3x10, cable flies 3x15, tricep pushdowns 4x12">${esc(t)}</textarea>
      <div id="prev"></div>
      <label>Date</label><input type="date" id="d" value="${todayISO()}">
      <label>Session name (optional)</label><input type="text" id="ti" placeholder="e.g. Push day">
      <button class="btn" id="send" style="margin-top:14px">Send to coach</button>
      <div class="muted" style="margin-top:10px">Works with anything — bodyweight, machines, cardio. Not sure of a name? Just write it, your coach handles the rest.</div>
    </div>
    ${recCard()}
    ${photoCard()}
    ${painCard()}
    ${moveCard()}`;
  app.querySelector("#tabLog").addEventListener("click", ()=>{ tab="log"; render(); });
  app.querySelector("#tabProg").addEventListener("click", ()=>{ tab="progress"; render(); });
  const ta = app.querySelector("#t");
  const pv = app.querySelector("#prev");
  pv.innerHTML = preview(t);
  ta.addEventListener("input", ()=>{ pv.innerHTML = preview(ta.value); });
  app.querySelector("#send").addEventListener("click", send);
  const rta = app.querySelector("#rt");
  if (rta){
    const rpv = app.querySelector("#rprev");
    rta.addEventListener("input", ()=>{ rpv.innerHTML = recPreview(rta.value); });
    app.querySelector("#sendrec").addEventListener("click", sendRec);
  }
  const phb = app.querySelector("#sendphoto");
  if (phb) phb.addEventListener("click", sendPhoto);
  const pcb = app.querySelector("#sendpc");
  if (pcb) pcb.addEventListener("click", sendPain);
  const mvf = app.querySelector("#mvfile");
  if (mvf) mvf.addEventListener("change", ()=>{ const f=(mvf.files||[])[0]; if (f){
    app.querySelector("#mvlbl").firstChild.textContent = "\u2713 " + (f.name.length>24?f.name.slice(0,24)+"\u2026":f.name) + " (" + Math.round(f.size/1048576) + "MB)";
    app.querySelector("#sendmv").style.display = "block"; } });
  const mvb = app.querySelector("#sendmv");
  if (mvb) mvb.addEventListener("click", sendMove);
}

function send(){
  const text = app.querySelector("#t").value.trim();
  if (!text){ alert("Type your workout first"); return; }
  const date = app.querySelector("#d").value || todayISO();
  const title = app.querySelector("#ti").value.trim();
  const btn = app.querySelector("#send"); btn.disabled = true; btn.textContent = "Sending…";
  fetch(`${worker}/submit?c=${encodeURIComponent(client)}&t=${encodeURIComponent(token)}`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ date, title, text })
  }).then(r=>r.json()).then(d=>{
    if (d.ok){ submitted = true; render(); }
    else { btn.disabled=false; btn.textContent="Send to coach"; alert("Couldn't send: "+(d.error||"try again")); }
  }).catch(e=>{ btn.disabled=false; btn.textContent="Send to coach"; alert("Network error — check your connection and retry."); });
}
function sendPain(){
  const b = app.querySelector("#pcb").value, w = app.querySelector("#pcw").value, n = app.querySelector("#pcn").value;
  if (b==="" && w==="" && n===""){ alert("Enter at least one pain score 0-10"); return; }
  const note = app.querySelector("#pcnote").value.trim();
  const text = `injury check-in — best ${b===""?"?":b}, worst ${w===""?"?":w}, now ${n===""?"?":n}${note?` — ${note}`:""}`;
  const btn = app.querySelector("#sendpc"); btn.disabled = true; btn.textContent = "Sending…";
  fetch(`${worker}/submit?c=${encodeURIComponent(client)}&t=${encodeURIComponent(token)}`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ kind:"paincheck", date: todayISO(), text })
  }).then(r=>r.json()).then(d=>{
    if (d.ok){ pcSent = true; render(); }
    else { btn.disabled=false; btn.textContent="Send check-in"; alert("Could not send: "+(d.error||"try again")); }
  }).catch(()=>{ btn.disabled=false; btn.textContent="Send check-in"; alert("Network error — retry."); });
}

function sendPhoto(){
  const btn = app.querySelector("#sendphoto"); btn.disabled = true; btn.textContent = "Sending…";
  fetch(`${worker}/submit?c=${encodeURIComponent(client)}&t=${encodeURIComponent(token)}`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ kind:"photo", date: todayISO(), text: "progress photos taken" })
  }).then(r=>r.json()).then(d=>{
    if (d.ok){ phSent = true; render(); }
    else { btn.disabled=false; btn.textContent="✓ I took progress photos today"; alert("Could not send: "+(d.error||"try again")); }
  }).catch(()=>{ btn.disabled=false; btn.textContent="✓ I took progress photos today"; alert("Network error — check your connection and retry."); });
}

function sendRec(){
  const text = app.querySelector("#rt").value.trim();
  if (!text){ alert("Type your recovery numbers first"); return; }
  const btn = app.querySelector("#sendrec"); btn.disabled = true; btn.textContent = "Sending…";
  fetch(`${worker}/submit?c=${encodeURIComponent(client)}&t=${encodeURIComponent(token)}`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ kind:"recovery", date: todayISO(), text })
  }).then(r=>r.json()).then(d=>{
    if (d.ok){ recSent = true; render(); }
    else { btn.disabled=false; btn.textContent="Send check-in"; alert("Could not send: "+(d.error||"try again")); }
  }).catch(()=>{ btn.disabled=false; btn.textContent="Send check-in"; alert("Network error — check your connection and retry."); });
}

if (worker){
  fetch(worker + "/exlib").then(r=>r.json()).then(d=>{ if (Array.isArray(d)) { customLib = d; render(); } }).catch(()=>{});
  if (client && token){
    fetch(`${worker}/me?c=${encodeURIComponent(client)}&t=${encodeURIComponent(token)}`)
      .then(r=>r.json()).then(d=>{
        if (d && d.me){ me = d.me; }
        else if (d && d.error === "bad token"){ meErr = "This link is out of date — text your coach for a fresh one."; }
        if (tab === "progress") render();
      }).catch(()=>{ meErr = "Couldn't reach the server — check your connection."; if (tab === "progress") render(); });
  } else if (client && !token){
    meErr = "This link is out of date — text your coach for a fresh one.";
  }
}
render();
</script>
</body>
</html>
